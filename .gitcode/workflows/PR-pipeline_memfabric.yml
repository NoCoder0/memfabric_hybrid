name: PR-pipeline_memfabric

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  pull_request_target:
    types:
      - open
      - update
      - reopen
    branches:
      - master
      - release/*

  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'

  pull_request_comment:
    types: [ created ]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' ]

permissions:
  repository: read
  id-token: write

env:
  py_version: "cp311-cp311"
  IS_MANYLINUX: TRUE
  pr_id: ${{ atomgit.event.pull_request.number }}
  IS_PR_EVENT: ${{ contains('pull_request_target,pull_request_comment,MR,Note', atomgit.event_name) }}

stages :
  stage_1:
    name: Codecheck
    jobs:
      associate_pr_comment:
        name: associate_pr_comment
        select: selected_by_default
        runs-on: [ self-hosted, default, x86, cpu=2 ]
        steps:
          - name: associate-pr-comment
            uses: associate-pr-comment

      pre_commit:
        name: precommit
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/memfabric-hybrid/memfabric-hybrid_x86:multi_python_v2
        steps:
          - name: Checkout repository
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge

          - name: setup-python
            run: |
              echo "PYTHON_HOME=/opt/python/${py_version}" >> $ATOMGIT_ENV
              echo "PATH=/opt/python/${py_version}/bin:${PATH}" >> $ATOMGIT_ENV

          - name: Python version
            run: |
              which python3
              which pip3.11
              PY3_PATH=$(which python3)
              ln -sf $PY3_PATH /usr/bin/python
              ln -sf $(which pip3.11) /usr/bin/pip
              which pip3.11
              python --version

          - name: install gitleaks
            run: |
              cd ${ATOMGIT_WORKSPACE}
              wget --no-host-directories -c --no-check-certificate https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/gitleaks
              chmod +x gitleaks

          - name: Run pre-commit
            uses: openlibing/pre-commit-action@v1.0.0

      SCA:
        name: SCA
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        steps:
          - name: Checkout repository
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge

          - name: Run sca-pr-action
            uses: openlibing/sca-action/sca-pr-action@v1.0.0
            with:
              project-name: BeiMing

      Antipoison:
        name: Antipoison
        runs-on: [ self-hosted, default, x86, cpu=16 ]
        steps:
          - name: Checkout repository
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge

          - name: Run malicious-code-pr-action
            uses: openlibing/malicious-code-scan-action/malicious-code-pr-scan-action@v1.0.0
            with:
              project-name: BeiMing

  stage_2:
    name: Build and UT
    jobs:
      Build_memfabric:
        name: Build_memfabric
        runs-on: [ self-hosted, default, arm, cpu=32 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/memfabric-hybrid/memfabric-hybrid_arm:multi_python_v2
        steps:
          - name: Checkout repository
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              submodules: false

          - name: Init submodules
            run: |
              git submodule init
              git submodule update --recursive --depth 1

          - name: build
            run: |
              mv /usr/bin/patchelf /usr/bin/patchelf.bak
              export PYTHON_HOME=/opt/python/${py_version}
              export PATH=/opt/python/${py_version}/bin:/usr/bin:$PATH

              pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
              pip3 config set global.trusted-host pypi.tuna.tsinghua.edu.cn
              pip3 install --upgrade setuptools wheel
              pip3 install pybind11==3.0.1
              bash script/build_and_pack_run.sh --build_test ON

      UT_memfabric:
        name: UT_memfabric
        runs-on: [ self-hosted, default, arm, cpu=32 ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/memfabric-hybrid/memfabric-hybrid_arm:multi_python_v2
        steps:
          - name: Checkout repository
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              submodules: false

          - name: Init submodules
            run: |
              git submodule init
              git submodule update --recursive --depth 1

          - name: ut
            run: |
              mv /usr/bin/patchelf /usr/bin/patchelf.bak
              export PYTHON_HOME=/opt/python/${py_version}
              export PATH=/opt/python/${py_version}/bin:/usr/bin:$PATH
              export CMAKE_PREFIX_PATH=$PYTHON_HOME
              export PYTHON3_EXECUTABLE=$(which python3)

              pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
              pip3 config set global.trusted-host pypi.tuna.tsinghua.edu.cn
              pip3 install --upgrade pip
              pip3 install --upgrade setuptools wheel
              pip3 install pybind11==3.0.1
              bash script/run_ut.sh
              cd output
              cp ./bin/gcover_report/test_detail.xml ./coverage/result/

          - name: upload ut coverage report
            if: ${{ always() && env.IS_PR_EVENT == 'true' }}
            uses: upload-artifact
            with:
              name: coverage-report
              path: ./output/coverage/result/*
              overwrite: true
              if-no-files-found: warn
              retention-days: 1
